name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/ScanUi.App/package-lock.json

      - name: Install Tailwind dependencies
        run: npm ci --prefix src/ScanUi.App

      - name: Build solution
        run: dotnet build src/ScanUi.slnx --configuration Release

      - name: Run tests
        run: dotnet test src/ScanUi.slnx --configuration Release --no-build
